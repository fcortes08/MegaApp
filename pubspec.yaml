name: megaapp
description: "App para tracking de Mega Bus"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Dependencias principales para MegaApp
  http: ^1.1.0                    # Para llamadas API al backend
  provider: ^6.1.1               # Gestión de estado (alternativa: riverpod)
  flutter_secure_storage: ^9.0.0 # Almacenamiento seguro de tokens
  google_maps_flutter: ^2.5.0    # Integración con Google Maps
  
  # Dependencias útiles adicionales
  shared_preferences: ^2.2.2     # Preferencias del usuario
  geolocator: ^10.1.0           # Geolocalización
  permission_handler: ^11.1.0   # Manejo de permisos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true